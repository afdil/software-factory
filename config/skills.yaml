# Per-Bot Skill Matrix & Installation Sources
# Run scripts/install-skills.ps1 to install external skills and copy local skills into ~/.agents/skills.

skill_sources:
  # Built-in Orca Desktop skills
  orca-cli:
    type: orca_builtin
    install: "orca skills install orca-cli"
  orchestration:
    type: orca_builtin
    install: "orca skills install orchestration"

  # Core external skills (installed globally)
  grill-with-docs:
    type: external
    repo: "https://github.com/mattpocock/skills"
    install: "npx.cmd -y skills add mattpocock/skills --skill grill-with-docs --global -y"
  grill-me:
    type: external
    repo: "https://github.com/mattpocock/skills"
    install: "npx.cmd -y skills add mattpocock/skills --skill grill-me --global -y"
  frontend-design:
    type: external
    repo: "https://github.com/anthropics/skills"
    install: "npx.cmd -y skills add https://github.com/anthropics/skills --skill frontend-design --global -y"
    notes: "Sole aesthetic framework for ui-designer; replaces conflicting UI themes."
  security-audit:
    type: external
    repo: "https://github.com/cloudflare/security-audit-skill"
    install: "npx.cmd -y skills add https://github.com/cloudflare/security-audit-skill --skill security-audit --global -y"
    notes: "Cloudflare's 6-phase vulnerability discovery harness for satpam."
  karpathy-guidelines:
    type: external
    repo: "https://github.com/multica-ai/andrej-karpathy-skills"
    install: "npx.cmd -y skills add multica-ai/andrej-karpathy-skills --skill karpathy-guidelines --global -y"
    notes: "Applied to architect, rust-dev, and vue-dev."

  # Framework skills (installed from onmax/nuxt-skills, skilld-dev/vue-ecosystem-skills, microsoft/playwright-cli)
  vue-ecosystem-bundle:
    type: external
    repo: "https://github.com/skilld-dev/vue-ecosystem-skills"
    install: "npx.cmd -y skills add skilld-dev/vue-ecosystem-skills --skill vue-skilld --skill shadcn-vue-skilld --skill pinia-skilld --skill vue-router-skilld --global -y"
    selected_skills:
      - vue-skilld
      - shadcn-vue-skilld
      - pinia-skilld
      - vue-router-skilld
  nuxt-bundle:
    type: external
    repo: "https://github.com/onmax/nuxt-skills"
    install: "npx.cmd -y skills add onmax/nuxt-skills --skill vue-best-practices --skill vue-router-best-practices --skill vue-testing-best-practices --skill pinia --skill vite --skill nuxt --skill nuxt-seo --global -y"
    selected_skills:
      - vue-best-practices
      - vue-router-best-practices
      - vue-testing-best-practices
      - pinia
      - vite
      - nuxt
      - nuxt-seo
  playwright-cli:
    type: external
    repo: "https://github.com/microsoft/playwright-cli"
    install: "npx.cmd -y skills add microsoft/playwright-cli --skill playwright-cli --global -y"

  # Custom local factory skills (skills/<name>/SKILL.md -> copied to ~/.agents/skills)
  factory-protocol:
    type: local
    path: "./skills/factory-protocol/SKILL.md"
  rust-axum-sqlx:
    type: local
    path: "./skills/rust-axum-sqlx/SKILL.md"
  web-qa-checklist:
    type: local
    path: "./skills/web-qa-checklist/SKILL.md"
  rust-vue-security:
    type: local
    path: "./skills/rust-vue-security/SKILL.md"
  coolify-deploy:
    type: local
    path: "./skills/coolify-deploy/SKILL.md"

bot_assignments:
  project-manager:
    required:
      - orca-cli
      - orchestration
      - factory-protocol
    excluded:
      - grill-with-docs
      - karpathy-guidelines

  architect:
    required:
      - grill-with-docs
      - karpathy-guidelines
      - factory-protocol
    optional:
      - grill-me

  ui-designer:
    required:
      - frontend-design
      - shadcn-vue-skilld
      - orca-cli
    excluded:
      - ui-ux-pro-max
      - primevue-skilld
      - vuetify-skilld
      - quasar-skilld
      - nuxt-ui

  rust-dev:
    required:
      - orchestration
      - karpathy-guidelines
      - rust-axum-sqlx

  vue-dev:
    required:
      - orchestration
      - karpathy-guidelines
      - vue-best-practices
      - vue-skilld
      - vue-router-best-practices
      - pinia
      - shadcn-vue-skilld
      - vite
      - nuxt
      - nuxt-seo
    excluded:
      - primevue-skilld
      - vuetify-skilld
      - quasar-skilld

  qa-tester:
    required:
      - orca-cli
      - web-qa-checklist
      - playwright-cli
      - vue-testing-best-practices

  satpam:
    required:
      - security-audit
      - rust-vue-security
    excluded:
      - karpathy-guidelines

  devops:
    required:
      - orca-cli
      - coolify-deploy
